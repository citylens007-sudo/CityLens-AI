[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "citylens-api"
version = "0.1.0"
description = "FastAPI foundation for CityLens AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "alembic>=1.14,<2.0",
  "pwdlib[argon2]>=0.2.1,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.8,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]
ai = [
  "opencv-python-headless>=4.10,<5.0",
  "ultralytics>=8.3,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]