services:
  - type: web
    name: citylens-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install .
    preDeployCommand: python -m alembic -c alembic.ini upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    disk:
      name: citylens-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EVIDENCE_STORAGE_PATH
        value: /var/data/evidence
      - key: ROAD_VIDEO_STORAGE_PATH
        value: /var/data/road-videos
      - key: ROAD_VIDEO_MAX_UPLOAD_BYTES
        value: "524288000"
      - key: ROAD_VIDEO_MAX_DURATION_SECONDS
        value: "3600"
      - key: ROAD_DAMAGE_SAMPLE_INTERVAL_SECONDS
        value: "1.0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_STARTTLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: EMAIL_VERIFICATION_TTL_HOURS
        value: "24"
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "15"
      - key: AUTH_SESSION_TTL_MINUTES
        value: "480"
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        value: CityLens Administrator
